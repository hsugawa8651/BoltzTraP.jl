name: CI

on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ matrix.test_group }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1.11'
        os:
          - ubuntu-latest
          - macos-latest
        arch:
          - x64
        test_group:
          - core
          - ext
        exclude:
          - os: macos-latest
            arch: x64
        include:
          - os: macos-latest
            arch: aarch64
            version: '1.10'
            test_group: core
          - os: macos-latest
            arch: aarch64
            version: '1.10'
            test_group: ext
          - os: macos-latest
            arch: aarch64
            version: '1.11'
            test_group: core
          - os: macos-latest
            arch: aarch64
            version: '1.11'
            test_group: ext
    steps:
      - uses: actions/checkout@v6

      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}

      - uses: julia-actions/cache@v3

      - uses: julia-actions/julia-buildpkg@v1

      - uses: julia-actions/julia-runtest@v1
        with:
          test_args: ${{ matrix.test_group }}
        env:
          TEST_WANNIER: 'true'

      - uses: julia-actions/julia-processcoverage@v1

      - uses: codecov/codecov-action@v6
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
