# CoSb3 Wannier path documented baseline (manual, frozen)
#
# Source: DFTK SCF + wannier90.x external Wannierization with the default
# random-projection setup, then BoltzTraP.jl WannierInterpolator +
# solve_transport. The wannier90 model files (~209 MB) come from a fixed
# random-projection realization that is not reproduced as part of the
# test suite; the values below are the canonical numerical record.
#
# Lattice: reftest/data/geometries/cosb3.jl (a = 17.080296 Bohr ≈ 9.04 Å,
# space group 204 Im-3). NOTE: this file uses conventional-cell lattice
# vectors with a 16-atom count, which is a known cell-volume error (the
# correct conventional cell holds 32 atoms; 16 is the primitive-cell count
# for this body-centered lattice) — not yet fixed as of this baseline.
#
# NOTE: this baseline predates two unrelated errors: a since-fixed
# sigma/kappa_el unit-conversion bug in BT.jl itself (inflated the Wannier
# path by a factor of ~6.75), and the cell-volume error described above.
# The valence anchor value below happened to land close to the Pizzi 2014
# reference as a result of these two errors partially cancelling; it is not
# a validated agreement. Plane-wave cutoff (Ecut) convergence for the DFT
# input has not been established either. See docs/src/wannier.md for details.
#
# Units:
#   sigma_xx_tau in 10^6 S/m
#   tau          = 10 fs
#   mu_eff       in eV (relative to the intrinsic Fermi level)
#   temperature  = 300 K

[metadata]
material      = "CoSb3"
temperature_K = 300
tau_fs        = 10
generator     = "DFTK + wannier90.x external + BoltzTraP.jl WannierInterpolator"

[anchors]
# Valence anchor. Not a validated Pizzi-2014 comparison — see file header.
valence_mu_eff_eV       = -1.25
valence_sigma_xx_tau    = 1.0481
valence_pizzi_2014_ref  = 1.0

# Mid-gap point (expected to be ≈ 0 due to gap, not a Pizzi-specific comparison)
mid_gap_mu_eff_eV       = 0.00
mid_gap_sigma_xx_tau    = 0.0208

[baseline]
mu_eff_eV    = [-2.00, -1.75, -1.50, -1.25, -1.00, -0.75, -0.50, -0.25,  0.00,  0.25,  0.50,  0.75,  1.00,  1.25,  1.50,  1.75,  2.00]
sigma_xx_tau = [ 0.3222, 1.0931, 1.0323, 1.0481, 0.7193, 0.2659, 0.1275, 0.0502, 0.0208, 0.0111, 0.0086, 0.0188, 0.0242, 0.2173, 0.0009, 0.6578, 0.1594]
